<div *ngIf="!isLoading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"> <div *ngFor="let p of products()" 
       class="group bg-white dark:bg-slate-800 rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 border border-gray-100 dark:border-slate-700">
    
    <div class="relative h-56 bg-gray-100 dark:bg-slate-700 overflow-hidden"> <img *ngIf="p.imageUrl" [src]="p.imageUrl" 
           class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-500">
      
      <div *ngIf="!p.imageUrl" class="flex flex-col items-center justify-center h-full text-center p-6 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-2 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <span class="text-xs font-bold uppercase tracking-widest">No Image</span>
        <span class="text-[10px] opacity-70 mt-1">#{{ p.sku || p.id }}</span>
      </div>

      <div class="absolute top-3 left-3 flex flex-col gap-1.5">
        <span *ngIf="p.is_perishable" class="bg-red-500/90 backdrop-blur-sm text-white text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider shadow-sm">Perishable</span>
        <span *ngIf="p.is_visible_in_mobile_app" class="bg-blue-500/90 backdrop-blur-sm text-white text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider shadow-sm">Mobile App</span>
      </div>
    </div>

    <div class="p-6"> <div class="flex justify-between items-center mb-2.5">
        <h3 class="font-bold text-xl leading-tight truncate pr-2 text-slate-800 dark:text-white">{{ p.name }}</h3>
        <span class="text-indigo-600 font-black text-2xl flex items-center gap-1">
          <span class="text-sm font-bold opacity-70">$</span>{{ p.price }}
        </span>
      </div>
      
      <p class="text-slate-500 dark:text-slate-400 text-sm line-clamp-2 mb-5 h-10">{{ p.description || 'No description available for this product.' }}</p>
      
      <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-slate-900 rounded-3xl mb-5 border border-gray-100 dark:border-slate-700">
        <div class="text-center flex-1">
          <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Stock</p>
          <div class="flex items-center justify-center gap-1.5">
            <span class="w-2 h-2 rounded-full" [ngClass]="(p.stock ?? 0) < 5 ? 'bg-red-500' : 'bg-green-500'"></span>
            <p class="font-extrabold text-lg text-slate-800 dark:text-white" [class.text-red-500]="(p.stock ?? 0) < 5">{{ p.stock }}</p>
          </div>
        </div>
        <div class="text-center border-l border-r px-5 border-gray-200 dark:border-slate-700 flex-1">
          <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Tax</p>
          <p class="font-extrabold text-lg text-slate-800 dark:text-white">{{ p.tax_rate }}<span class="text-xs font-medium">%</span></p>
        </div>
        <div class="text-center flex-1">
          <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">SKU</p>
          <p class="font-extrabold text-xs truncate w-16 mx-auto bg-gray-100 dark:bg-slate-700 px-2 py-0.5 rounded-md text-slate-600 dark:text-gray-300">{{ p.sku || 'N/A' }}</p>
        </div>
      </div>

      <button (click)="deleteProduct(p.id)" 
              class="w-full py-3 rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 font-bold transition flex items-center justify-center gap-2 group-hover:shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        Remove Product
      </button>
    </div>
  </div>
</div>
