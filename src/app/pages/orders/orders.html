<div class="p-2 min-h-screen bg-gray-50 dark:bg-gray-900 transition">
  <h1 class="text-3xl font-bold mb-8 text-gray-900 dark:text-white">
    📦 Orders
  </h1>

  <div class="max-w-7xl mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
        <thead class="bg-blue-600 dark:bg-blue-700 text-white">
          <tr>
            <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">Order ID</th>
            <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">Customer</th>
            <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">Date</th>
            <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">Total</th>
            <th class="px-6 py-3 text-left text-sm font-semibold uppercase tracking-wider">Status</th>
            <th class="px-6 py-3"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
          <tr *ngFor="let order of orders" class="hover:bg-gray-100 dark:hover:bg-gray-700 transition">
            <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900 dark:text-white">{{order.id}}</td>
            <td class="px-6 py-4 text-gray-700 dark:text-gray-300">{{order.customer}}</td>
            <td class="px-6 py-4 text-gray-700 dark:text-gray-300">{{order.date}}</td>
            <td class="px-6 py-4 text-gray-700 dark:text-gray-300">{{order.total}}</td>
            <td class="px-6 py-4">
              <span class="px-3 py-1 text-xs font-semibold rounded-full" [ngClass]="statusColor[order.status]">{{order.status}}</span>
            </td>
            <td class="px-6 py-4 text-right">
              <button class="text-blue-600 dark:text-blue-400 font-medium hover:underline">View</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
