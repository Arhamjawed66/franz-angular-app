<div
  class="min-h-screen p-6 transition-colors duration-300"
  [ngClass]="themeService.isDarkMode() ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-900'"
>
  <div>
    <h1 class="text-3xl font-bold tracking-wide flex gap-3 items-center">
      <fa-icon [icon]="faPalette" class="text-blue-500"></fa-icon>
      Theme Settings
    </h1>
    <p class="opacity-70 text-sm mt-1">Customize your application appearance</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
    <div
      class="rounded-2xl shadow-lg border transition p-6"
      [ngClass]="themeService.isDarkMode() ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'"
    >
      <h2 class="text-xl font-semibold mb-2">Mode</h2>
      <p class="text-sm opacity-70 mb-6">Switch between Light & Dark theme</p>

      <button
        (click)="themeService.toggleTheme()"
        class="w-full flex justify-between items-center border px-5 py-3 rounded-xl shadow-sm transition"
        [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 hover:bg-gray-600' : 'bg-gray-100 border-gray-300 hover:bg-gray-200'"
      >
        <span class="font-medium text-sm">{{ themeService.isDarkMode() ? "Dark Mode" : "Light Mode" }}</span>
        <fa-icon [icon]="themeService.isDarkMode() ? faMoon : faSun" class="text-xl"
          [ngClass]="themeService.isDarkMode() ? 'text-yellow-300' : 'text-yellow-500'"></fa-icon>
      </button>
    </div>

    <div
      class="rounded-2xl shadow-lg border p-6 transition"
      [ngClass]="themeService.isDarkMode() ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'"
    >
      <h2 class="text-xl font-semibold mb-2">Preview</h2>
      <p class="text-sm opacity-70 mb-6">See how your theme looks</p>

      <div
        class="rounded-xl p-6 h-48 flex items-center justify-center border text-center shadow-inner transition"
        [ngClass]="themeService.isDarkMode() ? 'bg-gray-900 border-gray-700' : 'bg-gray-100 border-gray-300'"
      >
        <span class="text-lg opacity-70">
          {{ themeService.isDarkMode() ? "Dark Mode Active 🌙" : "Light Mode Active ☀️" }}
        </span>
      </div>
    </div>
  </div>

  <h2 class="text-xl font-semibold mt-10 mb-4">Choose Theme Color</h2>
  <div class="flex gap-4">
    <div class="h-28 w-28 bg-blue-600 rounded-xl shadow cursor-pointer hover:ring-4 hover:ring-blue-300"></div>
    <div class="h-28 w-28 bg-green-600 rounded-xl shadow cursor-pointer hover:ring-4 hover:ring-green-300"></div>
    <div class="h-28 w-28 bg-purple-600 rounded-xl shadow cursor-pointer hover:ring-4 hover:ring-purple-300"></div>
  </div>
  <p class="mt-2 text-sm opacity-60">(* Color theme selection optional)</p>
</div>
