<div
  class="min-h-screen p-6 transition-colors duration-300"
  [ngClass]="themeService.isDarkMode() ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-900'"
>
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold">Settings</h1>
      <p class="text-sm opacity-70">Manage system users</p>
    </div>

    <button
      (click)="openModal()"
      class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg"
    >
      <fa-icon [icon]="faPlus"></fa-icon> Add User
    </button>
  </div>

  <div
    class="rounded-xl shadow-lg overflow-hidden border"
    [ngClass]="themeService.isDarkMode() ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'"
  >
    <table class="w-full">
      <thead
        class="text-left text-sm"
        [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 text-gray-200' : 'bg-gray-100'"
      >
        <tr>
          <th class="p-3">Name</th>
          <th class="p-3">Email</th>
          <th class="p-3">Role</th>
          <th class="p-3 text-center">Actions</th>
        </tr>
      </thead>

      <tbody class="text-sm">
        <tr
          *ngFor="let user of users"
          class="border-t"
          [ngClass]="themeService.isDarkMode() ? 'border-gray-700' : 'border-gray-200'"
        >
          <td class="p-3">{{ user.name }}</td>
          <td class="p-3">{{ user.email }}</td>
          <td class="p-3">{{ user.role }}</td>
          <td class="p-3 flex gap-4 justify-center">
            <fa-icon
              [icon]="faEdit"
              (click)="openModal(user)"
              class="cursor-pointer text-blue-500 hover:text-blue-700"
            ></fa-icon>
            <fa-icon
              [icon]="faTrash"
              (click)="deleteUser(user.id)"
              class="cursor-pointer text-red-500 hover:text-red-700"
            ></fa-icon>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="modalOpen" class="fixed inset-0 bg-black bg-opacity-40 flex justify-center items-center z-50">
    <div
      class="p-6 rounded-xl w-96 shadow-xl"
      [ngClass]="themeService.isDarkMode() ? 'bg-gray-800 text-white' : 'bg-white text-gray-900'"
    >
      <h2 class="text-lg font-semibold mb-4">{{ form.id ? "Edit User" : "Add User" }}</h2>

      <input
        placeholder="Name"
        class="w-full px-3 py-2 mb-3 rounded border"
        [(ngModel)]="form.name"
      />

      <input
        placeholder="Email"
        class="w-full px-3 py-2 mb-3 rounded border"
        [(ngModel)]="form.email"
      />

      <input
        placeholder="Role"
        class="w-full px-3 py-2 mb-4 rounded border"
        [(ngModel)]="form.role"
      />

      <div class="flex justify-end gap-3">
        <button class="px-4 py-2 rounded" (click)="modalOpen = false">
          Cancel
        </button>

        <button
          (click)="handleSubmit()"
          class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700"
        >
          {{ form.id ? "Update" : "Create" }}
        </button>
      </div>
    </div>
  </div>
</div>
