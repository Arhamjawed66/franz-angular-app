<section
  class="min-h-screen flex items-center justify-center transition-all duration-300"
  [ngClass]="themeService.isDarkMode() ? 'bg-gray-900' : 'bg-white'"
>
  <div
    class="w-full max-w-lg p-8 rounded-2xl shadow-xl border transition-all duration-300"
    [ngClass]="themeService.isDarkMode() ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-900'"
  >
    <h1
      class="text-2xl font-bold mb-6 text-center"
      [ngClass]="themeService.isDarkMode() ? 'text-blue-400' : 'text-blue-600'"
    >
      Create Store
    </h1>

    <form (ngSubmit)="handleSubmit()" class="space-y-5">
      <div>
        <label class="block mb-2 text-sm font-medium">Store Name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="form.name"
          class="w-full p-3 border rounded-lg transition-all duration-300 focus:ring-2"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 focus:ring-blue-500' : 'bg-blue-50 border-blue-300 focus:ring-blue-500'"
          placeholder="Enter store name"
          required
        />
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium">Owner Name</label>
        <input
          type="text"
          name="owner"
          [(ngModel)]="form.owner"
          class="w-full p-3 border rounded-lg transition-all duration-300 focus:ring-2"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 focus:ring-blue-500' : 'bg-blue-50 border-blue-300 focus:ring-blue-500'"
          placeholder="Enter owner name"
          required
        />
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium">Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="form.email"
          class="w-full p-3 border rounded-lg transition-all duration-300 focus:ring-2"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 focus:ring-blue-500' : 'bg-blue-50 border-blue-300 focus:ring-blue-500'"
          placeholder="example@domain.com"
          required
        />
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium">Phone</label>
        <input
          type="tel"
          name="phone"
          [(ngModel)]="form.phone"
          class="w-full p-3 border rounded-lg transition-all duration-300 focus:ring-2"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 focus:ring-blue-500' : 'bg-blue-50 border-blue-300 focus:ring-blue-500'"
          placeholder="+92XXXXXXXXXX"
          required
        />
      </div>

      <div>
        <label class="block mb-2 text-sm font-medium">Address</label>
        <textarea
          name="address"
          rows="3"
          [(ngModel)]="form.address"
          class="w-full p-3 border rounded-lg transition-all duration-300 focus:ring-2"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 focus:ring-blue-500' : 'bg-blue-50 border-blue-300 focus:ring-blue-500'"
          placeholder="Store address"
          required
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition-all"
      >
        Create Store
      </button>
    </form>
  </div>
</section>
