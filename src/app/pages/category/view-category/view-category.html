<div
  class="w-full min-h-screen p-6"
  [ngClass]="themeService.isDarkMode() ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'"
>
  <h2 class="text-3xl font-bold mb-6 text-center">All Categories</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div
      *ngFor="let cat of categories"
      class="p-5 rounded-2xl shadow-lg border transition-all"
      [ngClass]="themeService.isDarkMode() ? 'bg-gray-800 border-gray-700 hover:bg-gray-700' : 'bg-white border-gray-200 hover:bg-gray-50'"
    >
      <h3 class="text-xl font-semibold mb-2">{{ cat.name }}</h3>
      <p class="mb-2 text-gray-400">{{ cat.description || "No description" }}</p>
      <p class="text-sm"><span class="font-medium">Slug:</span> {{ cat.slug }}</p>
      <p class="text-sm"><span class="font-medium">Parent:</span> {{ cat.parent_category_id || "None" }}</p>
    </div>
  </div>

  <p *ngIf="categories.length === 0" class="text-center text-gray-500 mt-6">No categories found.</p>
</div>
