<div
  class="w-full flex justify-center items-center py-10 px-4"
  [ngClass]="themeService.isDarkMode() ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900'"
>
  <div
    *ngIf="toast.show"
    class="fixed top-5 right-5 px-4 py-2 rounded-xl shadow-lg text-white transition-all"
    [ngClass]="toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'"
  >
    {{ toast.message }}
  </div>

  <div
    class="w-full max-w-lg rounded-2xl p-8 shadow-2xl border transition-all"
    [ngClass]="themeService.isDarkMode() ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'"
  >
    <h2 class="text-3xl font-bold mb-6 text-center">Update Category</h2>

    <div class="mb-6">
      <label class="block mb-1 font-medium">Select Category</label>
      <select
        [(ngModel)]="selectedId"
        (ngModelChange)="onSelect()"
        class="w-full p-3 rounded-xl border focus:ring-2 transition"
        [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-300 focus:ring-blue-400'"
      >
        <option value="">-- Select Category --</option>
        <option *ngFor="let cat of categories" [value]="cat._id">
          {{ cat.name }}
        </option>
      </select>
    </div>

    <form *ngIf="selectedId" class="space-y-5" (ngSubmit)="handleSubmit()">
      <div>
        <label class="block mb-1 font-medium">Store ID *</label>
        <input
          name="store_id"
          [(ngModel)]="form.store_id"
          placeholder="Enter Store ID"
          class="w-full p-3 rounded-xl border focus:ring-2 transition"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-300 focus:ring-blue-400'"
        />
        <p *ngIf="errors['store_id']" class="text-red-500 text-sm mt-1">{{ errors['store_id'] }}</p>
      </div>

      <div>
        <label class="block mb-1 font-medium">Category Name *</label>
        <input
          name="name"
          [(ngModel)]="form.name"
          (ngModelChange)="onNameChange()"
          placeholder="Enter Category Name"
          class="w-full p-3 rounded-xl border focus:ring-2 transition"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-300 focus:ring-blue-400'"
        />
        <p *ngIf="errors['name']" class="text-red-500 text-sm mt-1">{{ errors['name'] }}</p>
      </div>

      <div>
        <label class="block mb-1 font-medium">Slug *</label>
        <input
          name="slug"
          [(ngModel)]="form.slug"
          placeholder="example-category"
          class="w-full p-3 rounded-xl border focus:ring-2 transition"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-300 focus:ring-blue-400'"
        />
        <p *ngIf="errors['slug']" class="text-red-500 text-sm mt-1">{{ errors['slug'] }}</p>
      </div>

      <div>
        <label class="block mb-1 font-medium">Description</label>
        <textarea
          name="description"
          rows="3"
          [(ngModel)]="form.description"
          placeholder="Write description..."
          class="w-full p-3 rounded-xl border focus:ring-2 transition"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-300 focus:ring-blue-400'"
        ></textarea>
      </div>

      <div>
        <label class="block mb-1 font-medium">Parent Category ID (optional)</label>
        <input
          name="parent_category_id"
          [(ngModel)]="form.parent_category_id"
          placeholder="Enter Parent Category ID"
          class="w-full p-3 rounded-xl border focus:ring-2 transition"
          [ngClass]="themeService.isDarkMode() ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-500' : 'bg-white border-gray-300 focus:ring-blue-400'"
        />
      </div>

      <button
        [disabled]="loading"
        type="submit"
        class="w-full py-3 rounded-xl font-semibold text-lg transition shadow-lg"
        [ngClass]="loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white'"
      >
        {{ loading ? "Updating..." : "Update Category" }}
      </button>
    </form>
  </div>
</div>
